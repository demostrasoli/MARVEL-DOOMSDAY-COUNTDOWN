
name: Build Doomsday APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: ZIP entpacken
        run: unzip -q DoomsdayCountdown_AndroidStudio_Projekt.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK installieren
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK erstellen
        run: gradle -p DoomsdayCountdown :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Doomsday-APK
          path: DoomsdayCountdown/app/build/outputs/apk/debug/app-debug.apk
          
